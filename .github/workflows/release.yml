name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish (for example v1.0.1)
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: '1.27.1'

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve and validate tag name
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi

          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid release tag '$TAG'. Expected a tag such as v1.0.1." >&2
            exit 1
          fi

          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # For manual releases, fail early with a clear message if the tag was
          # not pushed to GitHub. Tag-push events already guarantee this.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
              >/dev/null 2>&1; then
              echo "Tag '$TAG' does not exist on GitHub." >&2
              echo "Create and push it first:" >&2
              echo "  git tag $TAG" >&2
              echo "  git push origin $TAG" >&2
              exit 1
            fi
          fi

  verify:
    name: Verify before release (${{ matrix.os }})
    needs: resolve-tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Show release ref and toolchain
        shell: bash
        run: |
          echo "Release tag: ${{ needs.resolve-tag.outputs.tag }}"
          git rev-parse --verify HEAD
          go version

      - name: Unit tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Build native binary
        run: go build -trimpath ./cmd/localwp

      - name: CLI smoke test
        run: go run ./cmd/localwp --version

  release:
    name: Build and publish GitHub Release
    needs: [resolve-tag, verify]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist work

          build_target() {
            GOOS="$1"
            GOARCH="$2"
            NAME="localwp_${VERSION}_${GOOS}_${GOARCH}"
            DIR="work/$NAME"
            mkdir -p "$DIR"

            EXT=""
            [ "$GOOS" = "windows" ] && EXT=".exe"

            env GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 \
              go build -trimpath \
                -ldflags "-s -w -X main.version=$VERSION" \
                -o "$DIR/localwp$EXT" ./cmd/localwp

            cp LICENSE README.md "$DIR/"

            if [ "$GOOS" = "windows" ]; then
              (cd work && zip -qr "../dist/${NAME}.zip" "$NAME")
            else
              tar -C work -czf "dist/${NAME}.tar.gz" "$NAME"
            fi
          }

          build_target windows amd64
          build_target linux amd64
          build_target linux arm64
          build_target darwin amd64
          build_target darwin arm64

          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --generate-notes \
            --title "localwp $RELEASE_TAG"
